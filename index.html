<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leak Funnel: 3D village model</title>
<style>
:root{--bg:#f7f6f2;--fg:#1a1a18;--mut:#5f5e5a;--card:rgba(255,255,255,.93);--bd:#d3d1c7;--ac:#1F4E79;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a18;--fg:#f1efe8;--mut:#b4b2a9;--card:rgba(38,38,35,.93);--bd:#444441;--ac:#85B7EB}}
:root[data-theme="dark"]{--bg:#1a1a18;--fg:#f1efe8;--mut:#b4b2a9;--card:rgba(38,38,35,.93);--bd:#444441;--ac:#85B7EB}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{position:relative;height:100%;overflow:hidden}
#c{position:absolute;inset:0}
#top{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;pointer-events:auto}
h1{font-size:15px;margin:0;color:var(--ac);font-weight:600}
.sub{font-size:12px;color:var(--mut)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
button.on{border-color:var(--ac);outline:1px solid var(--ac)}
#leg{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:340px;font-size:12px;line-height:1.5}
#leg div{display:flex;align-items:center;gap:8px;margin:2px 0}
.k{width:12px;height:12px;flex:none}
</style>
</head>
<body>
<div id="app">
<div id="c"></div>
<div id="top">
<div class="card"><h1>Leak Funnel: 3D village model</h1><div class="sub">Drag to rotate, scroll or pinch to zoom</div></div>
<div class="card btns">
<button id="b1" class="on">1 Detect</button><button id="b2" class="on">2 Locate</button><button id="b3" class="on">3 Refine</button><button id="br">Auto-rotate</button>
</div>
</div>
<div id="leg" class="card">
<div><span class="k" style="background:#1D9E75"></span>Stage 1 detect: tank level, tank outlet, zone entries</div>
<div><span class="k" style="background:#EF9F27;border-radius:50%"></span>Stage 2 locate: main junctions, sub-main tail ends</div>
<div><span class="k" style="background:#E24B4A;clip-path:polygon(50% 0,100% 100%,0 100%)"></span>Stage 3 refine (optional): acoustic clamps, leak pin</div>
<div class="sub">Illustrative model, not to scale; validated in simulation</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
var el=document.getElementById('c');
var scene=new THREE.Scene();scene.background=new THREE.Color(0xdbe8f1);
var cam=new THREE.PerspectiveCamera(45,1,0.1,500);cam.position.set(48,36,52);
var rd=new THREE.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(rd.domElement);
var ctl=new THREE.OrbitControls(cam,rd.domElement);ctl.target.set(-2,5,4);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*0.48;ctl.autoRotateSpeed=1.2;
scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,0.95));
var dl=new THREE.DirectionalLight(0xffffff,0.8);dl.position.set(30,50,20);scene.add(dl);
function M(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.7},o||{}));}
function add(m,p,g){m.position.set(p[0],p[1],p[2]);(g||scene).add(m);return m;}
function pipe(a,b,r,col,g){var A=new THREE.Vector3(a[0],a[1],a[2]),B=new THREE.Vector3(b[0],b[1],b[2]),d=B.clone().sub(A);
var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),12),M(col));m.position.copy(A.clone().add(B).multiplyScalar(0.5));
m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());(g||scene).add(m);}
function label(t,p,g,col){var c=document.createElement('canvas');c.width=640;c.height=96;var x=c.getContext('2d');x.font='600 40px system-ui,sans-serif';
var w=x.measureText(t).width+44;x.fillStyle='rgba(255,255,255,0.93)';x.fillRect((640-w)/2,12,w,72);x.fillStyle=col||'#1F4E79';x.textAlign='center';x.textBaseline='middle';x.fillText(t,320,48);
var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(t.length>14?15:10,2.25,1);s.position.set(p[0],p[1],p[2]);(g||scene).add(s);}
add(new THREE.Mesh(new THREE.PlaneGeometry(95,75),M(0xc9d6b0)),[0,0,5]).rotation.x=-Math.PI/2;
var BL=0x378ADD;
/* tank */
var T=[-30,0,-15];
[[-2.5,-2.5],[2.5,-2.5],[-2.5,2.5],[2.5,2.5]].forEach(function(p){add(new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,10,8),M(0x777770)),[T[0]+p[0],5,T[2]+p[1]]);});
add(new THREE.Mesh(new THREE.CylinderGeometry(4,4,5,32),M(0x9fc4e8)),[T[0],12.5,T[2]]);
add(new THREE.Mesh(new THREE.CylinderGeometry(4.05,4.05,2,32),M(0x378ADD,{transparent:true,opacity:0.8})),[T[0],11.5,T[2]]);
add(new THREE.Mesh(new THREE.ConeGeometry(4.4,2.2,32),M(0xb4b2a9)),[T[0],16.2,T[2]]);
label('Overhead tank',[T[0],20,T[2]]);
/* pipes */
pipe([T[0],10,T[2]],[T[0],0.6,T[2]],0.4,BL);
pipe([T[0],0.6,T[2]],[32,0.6,T[2]],0.45,BL);
label('Main line',[-14,3.2,-15]);
var xs=[-14,4,22],names=['Zone 1','Zone 2: losing ~X L/h','Zone 3'];
xs.forEach(function(x,i){
pipe([x,0.6,-15],[x,0.6,26],0.3,BL);
label(names[i],[x,3,30],null,i==1?'#BA7517':'#1F4E79');
[-2,12].forEach(function(z){[-1,1].forEach(function(s){
var hx=x+s*6.5;
add(new THREE.Mesh(new THREE.BoxGeometry(4,3,4),M(0xf1efe8)),[hx,1.5,z]);
var rf=add(new THREE.Mesh(new THREE.ConeGeometry(3.4,2.2,4),M(0xb4524a)),[hx,4.1,z]);rf.rotation.y=Math.PI/4;
add(new THREE.Mesh(new THREE.BoxGeometry(0.9,1.8,0.1),M(0x5f5e5a)),[hx,0.9,z+2.02]);
pipe([x,0.6,z],[x+s*4.6,0.6,z],0.14,BL);
});});
});
/* zone 2 highlight */
var hl=add(new THREE.Mesh(new THREE.PlaneGeometry(17,43),new THREE.MeshBasicMaterial({color:0xEF9F27,transparent:true,opacity:0.22})),[4,0.06,5.5]);hl.rotation.x=-Math.PI/2;
/* stage 1 */
var G1=new THREE.Group(),G2=new THREE.Group(),G3=new THREE.Group();scene.add(G1,G2,G3);
var TEAL=0x1D9E75;
add(new THREE.Mesh(new THREE.BoxGeometry(1.6,1.6,1.6),M(TEAL)),[T[0]+4.5,12.5,T[2]],G1);
add(new THREE.Mesh(new THREE.BoxGeometry(1.8,1.8,1.8),M(TEAL)),[T[0],5,T[2]],G1);
xs.forEach(function(x){add(new THREE.Mesh(new THREE.BoxGeometry(1.8,1.8,1.8),M(TEAL)),[x,1.3,-12],G1);});
label('1 Detect',[-30,23,-15],G1,'#0F6E56');
/* stage 2 */
var AM=0xEF9F27;
[[-6,0.9,-15],[13,0.9,-15],[-14,0.9,25],[4,0.9,25],[22,0.9,25]].forEach(function(p){add(new THREE.Mesh(new THREE.SphereGeometry(1.1,20,16),M(AM)),p,G2);});
label('2 Locate',[13,4.2,-15],G2,'#BA7517');
/* stage 3 */
var RD=0xE24B4A;
[[4,1.4,1],[4,1.4,11]].forEach(function(p){add(new THREE.Mesh(new THREE.ConeGeometry(0.95,2.2,16),M(RD)),p,G3);});
var leak=add(new THREE.Mesh(new THREE.SphereGeometry(0.9,20,16),M(RD,{emissive:0xE24B4A,emissiveIntensity:0.6})),[4,0.9,6],G3);
var ring=add(new THREE.Mesh(new THREE.CylinderGeometry(6,6,0.15,48),new THREE.MeshBasicMaterial({color:0xE24B4A,transparent:true,opacity:0.25})),[4,0.12,6],G3);
var pin=add(new THREE.Mesh(new THREE.ConeGeometry(0.8,2.4,14),M(RD)),[4,4,6],G3);pin.rotation.x=Math.PI;
label('3 Leak pin ±10–25 m',[4,7.4,6],G3,'#A32D2D');
/* ui */
function tog(id,g){var b=document.getElementById(id);b.onclick=function(){g.visible=!g.visible;b.classList.toggle('on',g.visible);};}
tog('b1',G1);tog('b2',G2);tog('b3',G3);
var br=document.getElementById('br');br.onclick=function(){ctl.autoRotate=!ctl.autoRotate;br.classList.toggle('on',ctl.autoRotate);};
function fit(){var w=el.clientWidth,h=el.clientHeight;rd.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',fit);fit();
var t0=performance.now();
(function loop(){requestAnimationFrame(loop);var t=(performance.now()-t0)/1000;var s=1+0.25*Math.sin(t*4);leak.scale.set(s,s,s);ring.material.opacity=0.18+0.1*Math.sin(t*4);ctl.update();rd.render(scene,cam);})();
})();
</script>
</body>
</html>
